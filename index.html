<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0E1B33" />
    <title>Scapia Itinerary</title>

    <!-- Scapia-style type: geometric sans (Plus Jakarta Sans) + characterful serif accent (Fraunces italic) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500;1,9..144,600;0,9..144,600;0,9..144,700&display=swap"
      rel="stylesheet"
    />
    <style>
      * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
      html, body { margin: 0; padding: 0; }
      html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
      body {
        font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
        background: #EEF1F6;
        overscroll-behavior-y: none;
      }
      /* prevent iOS auto-zoom when focusing inputs (needs >=16px) */
      input, select, textarea { font-size: 16px; }
      button { -webkit-tap-highlight-color: transparent; }
      /* hide scrollbars on horizontal carousels */
      .no-scrollbar::-webkit-scrollbar { display: none; }
      .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
